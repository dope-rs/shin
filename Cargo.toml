[package]
name = "shin"
version = "0.13.0"
edition = "2024"
rust-version = "1.88"
description = "Hand-rolled single-threaded TLS 1.3"
license = "MIT"
repository = "https://github.com/dope-rs/shin"
authors = ["inq <gofiri@gmail.com>"]

[dependencies]
arrayvec = { version = "0.7", default-features = false }
ring = "0.17"
subtle = "2"
zeroize = { version = "1", default-features = false }
ml-kem = { version = "0.3", default-features = false, features = ["zeroize"] }

[dev-dependencies]
rcgen = "0.14"
rsa = { version = "0.9", features = ["getrandom"] }
rustls-pki-types = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
