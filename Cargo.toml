[package]
name = "shin"
version = "0.16.0"
edition = "2024"
rust-version = "1.95"
description = "Hand-rolled single-threaded TLS 1.3"
license = "MIT"
repository = "https://github.com/dope-rs/shin"
authors = ["inq <gofiri@gmail.com>"]

[dependencies]
ring = "0.17"
subtle = "2"
stringprep = "0.1.5"
unicode-normalization = "0.1"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
zeroize = { version = "1", default-features = false }
ml-kem = { version = "0.3", default-features = false, features = ["zeroize"] }
o3 = "0.14.1"

[dev-dependencies]
rcgen = "0.14"
rsa = { version = "0.9", features = ["getrandom"] }
rustls-pki-types = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
